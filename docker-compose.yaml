version: "3.7"

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=matcha
    ports:
      - 5427:5432
    volumes:
      - db:/pgdata
